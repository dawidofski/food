<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Food Diary</title>
    <script>
      // Apply the stored colour theme before first paint. Same decision as src/state/theme.ts; keep them in step.
      (function () {
        var p = null, d = false;
        try { p = localStorage.getItem('fd.theme'); } catch (e) {}
        try { d = matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && d);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
